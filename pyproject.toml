[project]
name = "dmitriy-plexlibrary"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "keyring>=25.7.0",
    "paramiko>=5.0.0",
    "platformdirs>=4.11.8",
    "pydantic>=2.13.5",
    "pyside6>=6.11.2",
    "smbprotocol>=1.17.0",
]

[project.scripts]
plexlibrary = "plexlibrary.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plexlibrary"]

[dependency-groups]
dev = [
    "mypy>=1.13",
]
